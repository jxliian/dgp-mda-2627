services:
  db:
    image: postgres:18-alpine
    container_name: autovida_postgres
    restart: always
    environment:
      POSTGRES_USER: autovida_admin
      POSTGRES_PASSWORD: Clench1234
      POSTGRES_DB: autovida_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
