services:
  db:
    image: postgres:18-alpine
    container_name: autovida_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-autovida_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-autovida_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
